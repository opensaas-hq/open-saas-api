name: 🐛 Bug Report
description: Create a report to help us improve open-saas-api
title: "[BUG]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Send request to '...'
        3. See error '...'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      placeholder: "e.g., Bun v1.1.30, macOS Sonoma, Docker Compose PostgreSQL"
    validations:
      required: true
